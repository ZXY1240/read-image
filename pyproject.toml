[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "read-image-plugin"
version = "0.7.0"
description = "Codex plugin that gives text-only models Doubao vision support for images, video, web pages, and Windows screenshots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ZXY1240" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "imageio-ffmpeg>=0.4,<1.0",
    "mcp>=1.0,<2.0",
    "pillow>=10.0,<13.0",
    "playwright>=1.40,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
read-image-vision = "read_image.mcp.read_image_server:main"
read-image-capture-page = "read_image.mcp.capture_page_server:main"
read-image-windows-capture = "read_image.mcp.windows_capture_server:main"

[tool.setuptools.packages.find]
include = ["read_image*"]

[tool.setuptools.package-data]
"read_image.assets.windows" = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
packages = ["read_image"]

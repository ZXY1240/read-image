name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy read_image
      - name: Test
        run: uv run pytest
      - name: Validate plugin
        run: uv run python scripts/validate_plugin.py
      - name: Prepare public release copy
        run: uv run python scripts/prepare_public_release.py --output "$RUNNER_TEMP/read-image-public"
      - name: Validate public release copy
        run: uv run python scripts/validate_plugin.py --root "$RUNNER_TEMP/read-image-public" --public

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $scripts = Get-ChildItem read_image/assets/windows/*.ps1
          foreach ($script in $scripts) {
            [scriptblock]::Create((Get-Content $script.FullName -Raw)) | Out-Null
          }
      - name: Tests
        run: uv run pytest

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy read_image
      - name: Test
        env:
          RUN_BROWSER_INTEGRATION: "1"
        run: uv run pytest
      - name: Validate plugin
        run: uv run python scripts/validate_plugin.py
      - name: Prepare public release copy
        run: uv run python scripts/prepare_public_release.py --output "$RUNNER_TEMP/read-image-public"
      - name: Validate public release copy
        run: uv run python scripts/validate_plugin.py --root "$RUNNER_TEMP/read-image-public" --public

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $scripts = Get-ChildItem read_image/assets/windows/*.ps1
          foreach ($script in $scripts) {
            [scriptblock]::Create((Get-Content $script.FullName -Raw)) | Out-Null
          }
      - name: Tests
        env:
          RUN_WINDOWS_CAPTURE_INTEGRATION: "1"
        run: uv run pytest
